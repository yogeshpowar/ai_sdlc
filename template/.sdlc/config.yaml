# Project config for the SDLC protocol (PROTO.md §9). Humans edit this file.
project: {{PROJECT}}
description: <one line: what this product is>

stack:
  backend: <lang/framework>
  web: <framework | none>
  app: <none | ios | android | rn | flutter>
  db: <engine | none>

agents:
  # Turn agents on/off for this project. Small projects can merge roles (§9).
  enabled:
    - orchestrator
    - reviewer
    - security
    - bd
    - triage
    - prd
    - data-req
    - data-flow
    - ux
    - ui
    - schema
    - backend
    - fe-web
    - docs
    - qa
    - devops
    - release
    - monitor
  disabled:
    - fe-app

docs:                           # the project's own living docs (PROTO.md §6.1). Project files, NOT in .sdlc/.
  readme: README.md
  contributing: CONTRIBUTING.md
  changelog: CHANGELOG.md
  product: docs/product.md      # what the product does today, for whom
  architecture: docs/architecture.md
  adr: docs/adr/                # ADR-NNNN-<slug>.md
  api: docs/api/                # the contract: openapi.yaml / *.proto / schema.graphql
  data_model: docs/data-model.md
  ux: docs/ux/                  # flows.md, screens/<slug>.md
  security: docs/security.md    # threat model, data classification, controls
  glossary: docs/glossary.md
  runbook: docs/runbook.md

environments: [dev, uat, stage, prod]
environment_mapping:            # how "deploy" is realised in this project
  dev: <feature branch | preview url>
  uat: <k8s namespace | git branch | url>
  stage: <...>
  prod: <...>

gates:
  build: <command>
  lint: <command>
  test: <command>
  smoke: <command or manual steps>
  coverage_min: 80
  retry_budget: 3
  monitor_window_min: 30

human_approvals:                # who signs off what, per item size (PROTO.md §3.4, §8)
  spec: [M]                     # story/PRD sign-off: [] | [M] | [S, M]
  prod_deploy: [S, M]           # drop S once you trust the pipeline
  flag_on_in_prod: true         # turning a feature flag on in prod needs approval
  destructive_migration: true

delivery:                       # iterative delivery (PROTO.md §3.3–3.8)
  walking_skeleton: true        # first item = hello world through the real pipeline to prod
  sizes:
    S: { max_acs: 3, max_tokens: 300000 }   # story.md, triggered design only
    M: { max_acs: 5, max_tokens: 800000 }   # short prd.md; bigger -> EPIC of slices
  refine_ahead: 3               # only this many backlog items are refined in detail
  wip_limit: 1                  # max items between DEV and PROD at once
  release_review: notify        # notify (carry on) | wait (block until you reply)
  feature_flags: true
  flag_max_age_days: 30
  spike_max_tokens: 200000
compliance: [none]              # none | pci-dss | gdpr | rbi | hipaa | ...

git:                            # §6.7 commit policy
  main_branch: main
  item_branch: feature/<ITEM-ID>  # fix/<ITEM-ID> for BUG, hotfix/<ITEM-ID> for HOTFIX
  remote: null                  # e.g. origin; null = local only
  push: on_commit               # on_commit | on_approval | never (approvals are always pushed unless never)
  checkpoint_min: 30            # dev agents commit at least this often while working

tracing:                        # §6.9
  run_timeout_min: 60
  heartbeat_min: 2              # max gap between an agent's progress events (feeds TODO.md / sdlc-watch)
  detail_events: true
  transcripts: true

tokens:                         # §6.10, always recorded; these are the budgets
  per_run_max: 200000
  per_item_max: 1500000
  warn_at_pct: 80
